# Configuration of Hugo
# Guide: https://docs.hugoblox.com/
# Hugo Documentation: https://gohugo.io/getting-started/configuration/

title: '해아림한의원 안양점'
baseURL: 'https://hearim-anyang.com/'

############################
## LANGUAGE
############################

defaultContentLanguage: ko
hasCJKLanguage: true
defaultContentLanguageInSubdir: false
removePathAccents: true

############################
## MENUS
############################

menus:
  main:
    - name: '홈'
      url: '/#hero'
      weight: 10
    - name: '원장소개'
      url: '/#about'
      weight: 20
    - name: '5대 특화진료'
      url: '/#clinics'
      weight: 30
    - name: '검사 & 치료'
      url: '/#systems'
      weight: 40
    - name: '진료 프로세스'
      url: '/#process'
      weight: 50
    - name: '미디어 & 칼럼'
      url: '/#media'
      weight: 60
    - name: 'FAQ'
      url: '/#faq'
      weight: 70
    - name: '오시는 길'
      url: '/#location'
      weight: 80

############################
## PAGE OPTIONS
############################

cascade:
  - target:
      path: /blog/**
      kind: page
    pager: true
    show_date: true
    show_date_updated: true
    reading_time: true
    commentable: true
    show_related: true
    share: true
    show_breadcrumb: false

############################
## OUTPUTS
############################

outputs:
  home: [HTML, RSS]
  section: [HTML, RSS]

############################
## ADVANCED
############################

build:
  writeStats: true
enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
disableAliases: true
timeout: 600000

taxonomies:
  author: authors
  tag: tags
  category: categories

markup:
  _merge: deep
  goldmark:
    renderer:
      unsafe: true
